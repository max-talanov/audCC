# Auditory thalamo-cortical sleep model -- MN5 ~5000-neuron run, TUNED thalamus.
#
# Large bio-plausible column with the HODGKIN-HUXLEY neuron model (ht_neuron),
# so the intrinsic currents behind spindles are present: I_T (T-type Ca2+
# rebound), I_h, I_NaP/I_KNa, and the SK2 burst after-hyperpolarisation on the
# reticular cells (HHParams.g_peak_KNa_RE, default 0.5).
#
#   srun python3 tc_run.py --config config/network_auditory_mn5_5k.yaml \
#       --threads $SLURM_CPUS_PER_TASK --outdir out --tag mn5_5k
#
# ---------------------------------------------------------------------------
# IMPORTANT -- these are DECLARED sizes, not the final neuron count.
# build_network() instantiates each SUBTYPE separately, so the actual network is
# ~1.65x larger than the sum below:
#     L23 E -> RS + FRB            (x2)
#     L23 I -> Basket + LTS + Axax (x3)
#     L5  E -> TuftRS + TuftIB     (x2)
#     L5/6 I -> Basket + LTS + Axax (x3, shared pool)
# The values here are calibrated so the model builds 5010 real neurons
# (verify with: cfg.total_neurons reports the declared 3050 -- the smaller,
# misleading number; see the README note).
# ---------------------------------------------------------------------------
#
# Measured cost at this size (8 threads, laptop; MN5 will differ):
#     ht_neuron (with SK):    ~31 s wall per   3 s of simulation
#                             ~5 min           30 s
#                             ~35 min         200 s  (needed for spindle
#                                                     density / ISI statistics)
#     iaf_cond_exp:           ~4x faster, but no intrinsic currents / no SK.
#
# NOTE on duration: 3 s spans only ~3 slow-oscillation cycles -- enough as a
# smoke test / scaling check, but NOT enough for spindle density, inter-spindle
# interval, or the ~0.02 Hz infraslow clustering (that needs >= 150 s). Override
# with --tstop for production runs.

network:
  thalamus:        # MGB: TC relay (E) + RE reticular (I) -- SK2 lives on RE
    E: 210
    I: 55
  L4:
    E: 640
    I: 160
  L23:
    E: 640
    I: 160
  L5:
    E: 530
    I: 130
  L6:
    E: 420
    I: 105

splits:
  L23_E: 2      # RS + FRB
  L23_I: 3      # Basket, LTS, Axoaxonic
  L4_E: 1
  L4_I: 1
  L5_E: 2       # TuftRS + TuftIB
  L56_I: 3      # shared L5/6 Basket, LTS, Axoaxonic
  L6_E: 1

simulation:
  neuron_model: ht_neuron   # Hodgkin-Huxley: I_T / I_h / I_NaP / I_KNa + SK2
  tstop: 3000.0             # ms -- 3 s (smoke test); raise for statistics
  dt: 0.1                   # ms
  v_init: -65

# ---------------------------------------------------------------------------
# TUNED thalamic parameters (the only difference from network_auditory_mn5_5k).
#
# Measured problem: with the defaults the relay (TC/MGB) fires ~1.1-1.3 Hz and,
# critically, does NOT burst -- ~1.8 spikes per burst against the >=2 the
# review requires -- so the "spindle" the runner detects is largely an artefact
# of the cortical UP-state burst train rather than a thalamic spindle.
#
# Deeper RE->TC inhibition drives the T-current rebound, which is the actual
# spindle mechanism. Measured at 5010 neurons, 4 s runs:
#
#   tc_slow_offset  tot_re_tc_gaba_a   TC spikes/burst
#         34 (def)        45 (def)          1.77
#         34              90                2.09
#         50              90                2.45   <- these values
#
# TC bursting roughly doubles and crosses the review's >=2 threshold.
#
# CAVEAT -- this is an improvement, not a solution: the RETICULAR cells still
# fire tonically (~1.7 spikes/burst) at every setting tried, including deep
# hyperpolarisation, so the RE<->TC loop still does not generate a true
# spindle. The full 10-criteria validation of these values has NOT been run
# (it is slow locally; run it on MN5 -- see run.sh). For spindles that pass all
# ten criteria today, use config/network_auditory_adex.yaml with TRIGGER=1.
hh:
  tc_slow_offset: 50.0        # relay baseline drive, pA (default 34)
  tot_re_tc_gaba_a: 90.0      # total RE->TC GABA_A conductance, nS (default 45)
